<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spofiyou</title>
  
  <!-- YouTube + Spotify fusion style -->
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0f0f0f; /* YouTube dark mode */
      color: #fff;
    }

    .header {
      display: flex;
      align-items: center;
      background-color: #FF0000; /* YouTube red */
      padding: 1rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .header img {
      height: 40px;
      margin-right: 1rem;
    }

    .header h1 {
      margin: 0;
      font-size: 1.6rem;
      color: #fff;
      font-weight: bold;
    }

    .youtube {
      padding: 2rem;
    }

    #playlist-list {
      background-color: #1f1f1f;
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      border-left: 4px solid #FF0000;
    }

    #playlist-list::before {
      content: "📺 ";
      font-size: 1.2rem;
    }

    a {
      color: #FF0000;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    button {
      background-color: #FF0000;
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 1rem;
    }

    button:hover {
      background-color: #e60000;
    }
  </style>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="/SpofiYou/spotify/apis/playlist.js"></script>
  <script src="/SpofiYou/spotify/apis/search.js"></script>
  <script src="/SpofiYou/spotify/apis/user.js"></script>
  <script src="/SpofiYou/youtube/apis/playlist.js"></script>
  <script src="/SpofiYou/youtube/apis/search.js"></script>
  <script src="/SpofiYou/youtube/utils.js"></script>
</head>
<body>
  <div class="header">
    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube Logo">
    <h1>Spofiyou</h1>
  </div>

  <div class="youtube">
    <div id="playlist-list">
      Your playlists:
      <!-- Example button -->
      <button>Sync with Spotify</button>
    </div>
  </div>

  <script src="./youtubeToSpotify.js"></script>
</body>
</html>
