<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spofiyou</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Google Font for clean design -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* Logo styling */
        #logo {
            display: block;
            margin: 30px auto;
            max-width: 200px; /* Adjust the max-width to control logo size */
            width: 100%; /* Ensures the logo resizes for responsiveness */
            height: auto;
        }

        #root {
            display: none;
            text-align: center;
            padding: 50px;
        }

        #root h3 {
            color: #1DB954;
            font-size: 36px;
            margin-bottom: 10px;
        }

        #root p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #666;
        }

        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Green button */
        .app .green-button {
            background-color: #1DB954;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 500;
            margin: 10px 0;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .app .green-button:hover {
            background-color: #1ed760;
        }

        .app .green-button:focus {
            outline: none;
        }

        /* Red button */
        .app .red-button {
            background-color: #d6112e;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 500;
            margin: 10px 0;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .app .red-button:hover {
            background-color: #de2f48;
        }

        .app .red-button:focus {
            outline: none;
        }

        /* Adding some responsiveness */
        @media (max-width: 600px) {
            #root {
                padding: 30px;
            }

            #root h3 {
                font-size: 28px;
            }

            .app input {
                width: 80%;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Zoho Logo -->
    <img src="https://www.pikpng.com/pngl/b/431-4313086_file-zoho-svg-zoho-logo-clipart.png" alt="Zoho Logo" id="logo">
    
    <div id="root">
        <h3>Spofiyou</h3>
        <p>Sync your Spotify and YouTube playlists</p>
        <div class="app">
            <input type="submit" value="Import Spotify playlists to YouTube" class="green-button" onclick="switchToSpotifyView()">
            <input type="submit" value="Import YouTube playlists to Spotify" class="red-button" onclick="switchToYoutubeView()">
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
